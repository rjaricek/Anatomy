<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysioMetrics - 3D Atlas Anatomie</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: rgba(16, 22, 34, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #viewport-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at center, #151d2a 0%, #080b10 100%);
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 20px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 13, 20, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 242, 254, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-bar-container {
      width: 240px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.2s ease;
    }

    #sidebar {
      width: 360px;
      height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      padding: 20px;
      gap: 20px;
    }

    .panel-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
    }

    .panel-card h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #info-cz {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    #info-lat {
      font-size: 14px;
      font-style: italic;
      color: #70a1ff;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    #info-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .tech-id {
      margin-top: 15px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .controls-hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-bone"></i></div>
        <div class="brand-title">
          <h1>PhysioMetrics 3D</h1>
          <p>Anatomický Studijní Atlas</p>
        </div>
      </div>
    </header>

    <div id="viewport-container">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="color: var(--text-main); font-weight: 500;">Načítám 3D model...</div>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <canvas id="canvas3d"></canvas>

      <div class="controls-hint">
        <span><i class="fa-solid fa-mouse"></i> Otáčení: Levé tlačítko</span>
        <span><i class="fa-solid fa-up-down-left-right"></i> Posun: Pravé tlačítko</span>
        <span><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom: Kolečko</span>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel-card" style="flex: 1;">
        <h3><i class="fa-solid fa-circle-info"></i> Detail struktury</h3>
        <div id="info-content">
          <div id="info-cz">Klikněte na část těla</div>
          <div id="info-lat">Položka nevybrána</div>
          <div id="info-tag" class="tag" style="display:none;">Soustava</div>
          <hr style="border: none; border-top: 1px solid var(--panel-border); margin: 12px 0;">
          <p id="info-desc">Kliknutím na jakoukoli kost nebo sval zobrazíte jeho název v češtině, latině a podrobný popis.</p>
          <div id="info-tech" class="tech-id"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // Česká a Latinská anatomická databáze
    const anatomyDB = {
      'cranium': { cz: 'Lebka', lat: 'Cranium', sys: 'Kosterní soustava', desc: 'Schránka chránící mozek a smyslové orgány.' },
      'femur': { cz: 'Kost stehenní', lat: 'Os femoris', sys: 'Kosterní soustava', desc: 'Nejdelší a nejsilnější kost v lidském těle.' },
      'humerus': { cz: 'Kost pažní', lat: 'Humerus', sys: 'Kosterní soustava', desc: 'Dlouhá kost tvořící podklad nadloktí.' },
      'pelvis': { cz: 'Pánev', lat: 'Pelvis', sys: 'Kosterní soustava', desc: 'Kostěný kruh spojující páteř s dolními končetinami.' },
      'biceps': { cz: 'Dvojhlavý sval pažní', lat: 'Musculus biceps brachii', sys: 'Svalová soustava', desc: 'Sval na přední straně nadloktí, oheč loketního kloubu.' },
      'deltoid': { cz: 'Deltoidový sval', lat: 'Musculus deltoideus', sys: 'Svalová soustava', desc: 'Sval pokrývající ramenní kloub.' },
      'pectoralis': { cz: 'Velký prsní sval', lat: 'Musculus pectoralis major', sys: 'Svalová soustava', desc: 'Mohutný vějířovitý sval přední stěny hrudníku.' }
    };

    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 1.2, 2.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.9, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    if (window.MeshoptDecoder) {
      loader.setMeshoptDecoder(window.MeshoptDecoder);
    }

    let loadedModel = null;
    let selectedObject = null;
    let originalMaterial = null;

    const highlightMaterial = new THREE.MeshStandardMaterial({
      color: 0x00f2fe,
      emissive: 0x0072ff,
      emissiveIntensity: 0.5,
      roughness: 0.2
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    loader.load(
      'muscular_insertions-v1.glb',
      (gltf) => {
        loadedModel = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(loadedModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 1.6 / maxDim;
        loadedModel.scale.setScalar(scale);

        loadedModel.position.x = -center.x * scale;
        loadedModel.position.y = -center.y * scale + 0.8;
        loadedModel.position.z = -center.z * scale;

        scene.add(loadedModel);

        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 500);
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('progress-bar').style.width = percent + '%';
          document.getElementById('loading-text').innerText = `Načítám 3D model... ${percent}%`;
        }
      }
    );

    window.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (loadedModel) {
        const intersects = raycaster.intersectObjects(loadedModel.children, true);
        if (intersects.length > 0) {
          const hit = intersects[0].object;

          if (selectedObject && originalMaterial) {
            selectedObject.material = originalMaterial;
          }

          selectedObject = hit;
          originalMaterial = hit.material;
          hit.material = highlightMaterial;

          const rawName = (hit.name || '').toLowerCase();
          let matched = null;

          for (let key in anatomyDB) {
            if (rawName.includes(key)) {
              matched = anatomyDB[key];
              break;
            }
          }

          const tagEl = document.getElementById('info-tag');
          if (matched) {
            document.getElementById('info-cz').innerText = matched.cz;
            document.getElementById('info-lat').innerText = matched.lat;
            document.getElementById('info-desc').innerText = matched.desc;
            tagEl.innerText = matched.sys;
            tagEl.style.display = 'inline-block';
          } else {
            document.getElementById('info-cz').innerText = 'Anatomická struktura';
            document.getElementById('info-lat').innerText = 'Názvosloví v přípravě';
            document.getElementById('info-desc').innerText = 'Tato část 3D modelu zatím nemá přiřazen detailní popis v databázi.';
            tagEl.style.display = 'none';
          }
          document.getElementById('info-tech').innerText = `ID Objektu: ${hit.name || 'neznámé'}`;
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
